services:
  frontend:
    build:
      context: ./frontendproject
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "4200:80"
    networks:
      - app-network
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:8080

  backend:
    build:
      context: ./backendproject
      dockerfile: Dockerfile
      args:
        DOCKER_GID: 997
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/usersDep?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITLAB_CLIENT_ID=${GITLAB_CLIENT_ID}
      - GITLAB_CLIENT_SECRET=${GITLAB_CLIENT_SECRET}
    volumes:
      - git-repos:/app/cloned-repos
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=usersDep
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

volumes:
  git-repos:
  mysql-data:

networks:
  app-network:
    driver: bridge